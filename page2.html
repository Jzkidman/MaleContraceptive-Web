    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #000000;
            font-family: 'neue-haas-grotesk-display', sans-serif;
            scroll-snap-type: y proximity;
            overflow-y: scroll;
            height: 100vh;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Navigation */
        nav {
            position: block;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 60px 10vw;
            background: transparent;
            z-index: 100;
            box-sizing: border-box;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(18px, 2vw, 32px);
            letter-spacing: 2px;
            transition: color 0.3s;
            white-space: nowrap;
        }

        nav .nav-left {
            display: flex;
            gap: clamp(40px, 8vw, 120px);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
        }

        nav .nav-right {
            display: flex;
            gap: clamp(30px, 5vw, 80px);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
        }

        nav a:hover {
            color: #00d9ff;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #canvas-container canvas {
            pointer-events: none;
        }

        #content {
            position: relative;
            width: 100vw;
            background: transparent;
            padding: 0;
            pointer-events: auto;
        }

        .section {
            padding: 120px 60px 60px 60px;
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
        }

        .small {
            min-height: 5vh;
            height: 5vh;
        }

        .section-title {
            font-size: clamp(48px, 6vw, 80px);
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.2;
        }


        .stat-circle {
            background: #000000;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }

        .stat-circle .number {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
        }

        .stat-circle .label {
            font-size: 14px;
            color: #ffffff;
            text-align: center;
            padding: 0 20px;
        }

        .stats-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 40px 0;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
        }

        .gradient-section {
            background: linear-gradient(180deg, #000000 0%, #73E333 80%, #000000 100%);
        }

        .final-text {
            font-size: clamp(60px, 10vw, 120px);
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            line-height: 1.2;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .ontop {
            z-index: 10;
        }

        .lower {
            margin-bottom: 600px;
        }

        /* Final Section - Why Not */
        .final-section {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .final-section .so-text {
            font-size: 72px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 250px;
            letter-spacing: 8px;
        }

        .final-section .why-not {
            font-size: 180px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
            margin: 40px 0;
            margin-bottom: 420px;
            top: -300px;
            position: absolute;
        }

        /* Footer Navigation */
        footer {
            position: relative;
            width: 100%;
            background: transparent;
            z-index: 100;
            margin-top: 300px;
        }

        footer .learn-more {
            text-align: center;
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #00d9ff;
        }

        footer .links {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0;
            background: transparent;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .section {
                padding: 40px 30px;
            }

            .stats-container {
                gap: 20px;
            }

            .stat-circle {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
