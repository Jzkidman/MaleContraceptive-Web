        body {

            padding: 0;
            overflow: hidden;
            background: #000000;
            font-family: 'neue-haas-grotesk-display', sans-serif;
            height: 100vh;
            width: 100vw;
            position: relative;
            transition: background 1.5s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-out;
            z-index: 0;

        body.instagram-active::before {

            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;

            justify-content: space-between;
            align-items: flex-start;
            padding: 60px 10vw;

            z-index: 100;

            transition: color 0.3s;
            white-space: nowrap;
        }

        nav .nav-left {
            display: flex;
            gap: clamp(40px, 8vw, 120px);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
        }

        nav .nav-right {
            display: flex;
            gap: clamp(30px, 5vw, 80px);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
        }

        nav a:hover {
            color: #00d9ff;
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #canvas-container canvas {
            pointer-events: none;
        }

        /* Main Content */
        .main-content {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 25vh;
            z-index: 10;
            pointer-events: none;
        }

        .page-title {
            font-size: clamp(48px, 8vw, 80px);
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 4px;
        }

        /* Social Icons */
        .social-icons {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(700px, 80vw);
            height: min(700px, 80vh);
            z-index: 100;
            pointer-events: none;
        }

        .social-icon {
            position: absolute;
            width: clamp(60px, 8vw, 80px);
            height: clamp(60px, 8vw, 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            pointer-events: auto;
        }

        /* Position each icon in a circle around the center */
        .social-icon.instagram {
            top: 50%;
            left: calc(-5vw + 20px);
            transform: translateY(-50%);
        }

        .social-icon.email {
            top: 50%;
            right: calc(-5vw + 20px);
            transform: translateY(-50%);
        }

        .social-icon.facebook {
            bottom: 0;
            left: 85%;
            transform: translateX(-50%);
        }

        .social-icon.twitter {
            bottom: 0;
            right: 85%;
            transform: translateX(50%);
        }

        .social-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            transition: all 0.3s ease;
        }

        /* Hover effects - scale up and change color */
        .social-icon:hover {
            transform: scale(1.3);
        }

        .social-icon.instagram:hover {
            transform: translateY(-50%) scale(1.3);
        }

        .social-icon.email:hover {
            transform: translateY(-50%) scale(1.3);
        }

        .social-icon.facebook:hover {
            transform: translateX(-50%) scale(1.3);
        }

        .social-icon.twitter:hover {
            transform: translateX(50%) scale(1.3);
        }

        .social-icon.instagram:hover svg {
            fill: url(#instagram-gradient);
        }

        .social-icon.facebook:hover svg {
            fill: #1877F2;
        }

        .social-icon.twitter:hover svg {
            fill: #1DA1F2;
        }

        .social-icon.email:hover svg {
            fill: #EA4335;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 50;
        }

        @media (max-width: 768px) {
            nav {
                padding: 30px 5vw;
                flex-direction: column;
                gap: 20px;
                align-items: stretch;
            }

            nav .nav-left,
            nav .nav-right {
                gap: 20px;
                justify-content: center;
            }

            nav a {
                font-size: 16px;
            }

            .page-title {
                font-size: 36px;
                padding: 0 20px;
            }

            .main-content {
                padding-top: 20vh;
            }
        }
    </style>

    <script>
        // Social media icon background gradient effect
        const socialIcons = document.querySelectorAll('.social-icon');
        const body = document.body;
        let activeClass = null;
        let isClicked = false;

        socialIcons.forEach(icon => {
            // Get the icon type from class list
            const iconType = Array.from(icon.classList).find(c =>
                ['instagram', 'facebook', 'twitter', 'email'].includes(c)
            );

            // Mouse enter event - activate gradient
            icon.addEventListener('mouseenter', (e) => {
                if (!isClicked) {
                    updateGradientPosition(e);
                    setActiveBackground(iconType);
                }
            });

            // Mouse move event - update gradient position
            icon.addEventListener('mousemove', (e) => {
                if (!isClicked) {
                    updateGradientPosition(e);
                }
            });

            // Mouse leave event - deactivate gradient if not clicked
            icon.addEventListener('mouseleave', () => {
                if (!isClicked) {
                    clearActiveBackground();
                }
            });

            // Click event - lock the gradient
            icon.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent immediate navigation
                updateGradientPosition(e);
                setActiveBackground(iconType);
                isClicked = true;

                // Navigate after a short delay to show the effect
                setTimeout(() => {
                    window.open(icon.href, icon.target || '_self');
                    // Reset after navigation attempt
                    setTimeout(() => {
                        isClicked = false;
                        clearActiveBackground();
                    }, 300);
                }, 400);
            });
        });

        function updateGradientPosition(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = ((rect.left + rect.width / 2) / window.innerWidth) * 100;
            const y = ((rect.top + rect.height / 2) / window.innerHeight) * 100;

            body.style.setProperty('--mouse-x', `${x}%`);
            body.style.setProperty('--mouse-y', `${y}%`);
        }

        function setActiveBackground(type) {
            clearActiveBackground();
            activeClass = `${type}-active`;
            body.classList.add(activeClass);
        }

        function clearActiveBackground() {
            if (activeClass) {
                body.classList.remove(activeClass);
                activeClass = null;
            }
        }

        // Clear gradient on body click outside of icons
        body.addEventListener('click', (e) => {
            if (!e.target.closest('.social-icon')) {
                isClicked = false;
                clearActiveBackground();
            }
        });
    </script>
